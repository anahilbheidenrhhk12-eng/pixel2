name: Build Digi Pixel One APK

on:
  push:
    branches: [android-test]
    paths:
      - "pixel-one-app/**"
      - ".github/workflows/build-digi-pixel-one.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Check preinstalled Android SDK
        run: sdkmanager --version
      - name: Install Android platform
        run: sdkmanager 'platforms;android-35' 'build-tools;35.0.0'
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'
      - name: Compile app
        run: gradle --no-daemon -p pixel-one-app assembleDebug
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: DigiPixelOne-APK
          path: pixel-one-app/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 14
