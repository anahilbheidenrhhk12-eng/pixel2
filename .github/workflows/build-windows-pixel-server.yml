name: Build Windows Pixel Android Emulator Server

on:
  push:
    branches: [android-test]
    paths:
      - "windows_server/**"
      - ".github/workflows/build-windows-pixel-server.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-windows:
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          architecture: 'x64'
      - name: Validate Windows server sources
        shell: pwsh
        run: |
          python -m py_compile windows_server/agent.py windows_server/winpixel_sdk.py native_google_one_probe.py device_simulator.py config.py
      - name: Install Windows packaging dependencies
        shell: pwsh
        run: python -m pip install --disable-pip-version-check pyinstaller==6.16.0 selenium==4.21.0 pyotp==2.10.0 webdriver-manager==4.0.1
      - name: Compile standalone Windows server EXE
        shell: pwsh
        run: |
          python -m PyInstaller --noconfirm --clean --onefile --windowed --name DigiPixelServer --paths . --paths windows_server --hidden-import native_google_one_probe --hidden-import device_simulator --hidden-import config --hidden-import selenium windows_server/agent.py
      - name: Check executable exists
        shell: pwsh
        run: |
          if (!(Test-Path dist/DigiPixelServer.exe)) { throw 'Missing DigiPixelServer.exe' }
          Get-Item dist/DigiPixelServer.exe | Select-Object Name,Length
      - name: Upload Windows server
        uses: actions/upload-artifact@v4
        with:
          name: DigiPixelServer-Windows
          path: |
            dist/DigiPixelServer.exe
            windows_server/START_PIXEL_SERVER.bat
            windows_server/README_AR.md
          retention-days: 14
